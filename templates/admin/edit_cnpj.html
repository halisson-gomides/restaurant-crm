<form id="edit-registration-form" onsubmit="submitEditForm(event, '{{ registration.id }}', 'CNPJ')">
    <div class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Company Info -->
            <div class="col-span-2">
                <h4 class="text-lg font-medium text-gray-900 mb-4 border-b pb-2">Dados da Empresa</h4>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="razao_social" class="form-label">Razão Social</label>
                        <input type="text" id="razao_social" name="razao_social" class="form-input" value="{{ registration.razao_social }}" required>
                    </div>
                    <div>
                        <label class="form-label">CNPJ (Não editável)</label>
                        <input type="text" class="form-input bg-gray-100" value="{{ registration.cnpj }}" disabled>
                    </div>
                    <div>
                        <label for="qual_seu_negocio" class="form-label">Tipo de Negócio</label>
                        <select id="qual_seu_negocio" name="qual_seu_negocio" class="form-select" required>
                            {% set types = ["Academia", "Adega", "Bar", "Bomboniere", "Cantina", "Clube esportivo", "Condomínio", "Confeitaria", "Doceria", "Dogueiro", "Escola", "Food service", "Hotel", "Instituição religiosa", "Lanchonete", "Mercearia", "Mini mercado", "Padaria", "Pastelaria", "Pizzaria", "Restaurante", "Outros"] %}
                            {% for type in types %}
                            <option value="{{ type }}" {% if registration.qual_seu_negocio == type %}selected{% endif %}>{{ type }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" id="email" name="email" class="form-input" value="{{ registration.email }}" required>
                    </div>
                    <div>
                        <label for="celular" class="form-label">Celular</label>
                        <input type="text" id="celular" name="celular" class="form-input" value="{{ registration.celular }}" required oninput="this.value = formatPhone(this.value)">
                    </div>
                </div>
            </div>

            <!-- Contact Info -->
            <div class="col-span-2">
                <h4 class="text-lg font-medium text-gray-900 mb-4 border-b pb-2">Dados do Responsável</h4>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="seu_nome" class="form-label">Nome</label>
                        <input type="text" id="seu_nome" name="seu_nome" class="form-input" value="{{ registration.seu_nome }}" required>
                    </div>
                    <div>
                        <label for="sua_funcao" class="form-label">Função</label>
                        <select id="sua_funcao" name="sua_funcao" class="form-select" required>
                            {% set roles = ["Proprietário", "Gerente", "Estoquista"] %}
                            {% for role in roles %}
                            <option value="{{ role }}" {% if registration.sua_funcao == role %}selected{% endif %}>{{ role }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>

            <!-- Address Info -->
            <div class="col-span-2">
                <h4 class="text-lg font-medium text-gray-900 mb-4 border-b pb-2">Endereço</h4>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="cep" class="form-label">CEP</label>
                        <input type="text" id="cep" name="cep" class="form-input" value="{{ registration.cep }}" required maxlength="9">
                    </div>
                    <div class="md:col-span-2">
                        <label for="endereco" class="form-label">Endereço</label>
                        <input type="text" id="endereco" name="endereco" class="form-input" value="{{ registration.endereco }}" required>
                    </div>
                    <div>
                        <label for="bairro" class="form-label">Bairro</label>
                        <input type="text" id="bairro" name="bairro" class="form-input" value="{{ registration.bairro }}" required>
                    </div>
                    <div>
                        <label for="cidade" class="form-label">Cidade</label>
                        <input type="text" id="cidade" name="cidade" class="form-input" value="{{ registration.cidade }}" required>
                    </div>
                    <div>
                        <label for="estado" class="form-label">Estado</label>
                        <select id="estado" name="estado" class="form-select" required>
                            {% set states = ["AC", "AL", "AP", "AM", "BA", "CE", "DF", "ES", "GO", "MA", "MT", "MS", "MG", "PA", "PB", "PR", "PE", "PI", "RJ", "RN", "RS", "RO", "RR", "SC", "SP", "SE", "TO"] %}
                            {% for state in states %}
                            <option value="{{ state }}" {% if registration.estado == state %}selected{% endif %}>{{ state }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>

            <!-- Settings -->
            <div class="col-span-2">
                <h4 class="text-lg font-medium text-gray-900 mb-4 border-b pb-2">Configurações</h4>
                <div class="flex items-center">
                    <input type="checkbox" id="marketing_opt_in" name="marketing_opt_in" class="form-checkbox h-5 w-5 text-indigo-600" {% if registration.marketing_opt_in %}checked{% endif %}>
                    <label for="marketing_opt_in" class="ml-2 block text-sm text-gray-900">
                        Aceita receber marketing
                    </label>
                </div>
            </div>
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t">
            <button type="button" class="btn btn-secondary" onclick="closeModal('view-modal')">Cancelar</button>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save mr-2"></i>Salvar Alterações
            </button>
        </div>
    </div>
</form>
